# GDAL OSM Configuration for Saildrop-OS Tile Generator
# This file configures which OSM tags are extracted as columns during ogr2ogr conversion

[general]
report_all_nodes=no
report_all_ways=no
attribute_name_laundering=yes

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,place,natural,seamark:type,leisure,harbour,ele
unsignificant_wkt_precision=yes

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway,waterway,natural,railway,man_made,barrier,aerialway
unsignificant_wkt_precision=yes

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,natural,water,waterway,landuse,leisure,building,place,admin_level,boundary
unsignificant_wkt_precision=yes

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,natural,waterway
unsignificant_wkt_precision=yes

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,natural,place,boundary,admin_level
unsignificant_wkt_precision=yes
